name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Scriptax v__VERSION__
          releaseBody: |
            ローカル Markdown メモエディタ Scriptax のリリースです。

            **Assets から OS に合ったファイルを選んでください**

            | OS | ファイル例 |
            |----|-----------|
            | Windows | `.msi` / `.exe`（NSIS） |
            | macOS (Apple Silicon) | `aarch64` の `.dmg` |
            | macOS (Intel) | `x64` の `.dmg` |
            | Linux | `.deb` / `.AppImage` |

            初回起動時にメモの保存先フォルダを設定します。

            **既知の制約**
            - コード署名・公証なし（Windows SmartScreen / macOS Gatekeeper の警告が出る場合あり）
            - macOS: 初回は右クリック →「開く」が必要な場合あり
            - 提示 viewer の Mermaid は CDN（jsDelivr）を利用
            - メモはローカル保存（クラウド同期なし）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
